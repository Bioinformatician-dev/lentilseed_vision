<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 220" width="900" height="220"
     role="img" aria-label="LentilSeedVision — image-based lentil seed phenotyping">
  <title>LentilSeedVision</title>
  <!--
    Title banner. The seed traces itself, the caliper measures it, then the
    seven workflow panels light along the rule in order — the same sequence the
    app's stage spine follows during a run. Colours match ui/theme.py.
  -->
  <style>
    .paper { fill: #FAFBFA; }
    .edge  { fill: none; stroke: #E2E6E3; stroke-width: 1; }
    .ink   { fill: #1B2116; }
    .muted { fill: #6F7B76; }
    .word  { font-family: 'Bricolage Grotesque', 'DejaVu Sans', sans-serif; font-weight: 600;
             font-size: 44px; letter-spacing: -0.02em; }
    .tag   { font-family: 'Bricolage Grotesque', 'DejaVu Sans', sans-serif; font-size: 17px; }
    .mono  { font-family: 'Bricolage Grotesque', 'DejaVu Sans Mono', monospace; font-size: 11px; }

    .coat  { fill: #E6D5B8; fill-opacity: 0; animation: ink .6s .5s ease forwards; }
    .trace { fill: none; stroke: #1B2116; stroke-width: 3; stroke-linecap: round;
             stroke-dasharray: 250; stroke-dashoffset: 250;
             animation: draw 1.1s .1s cubic-bezier(.4,0,.2,1) forwards; }
    .spot  { fill: #6B5334; opacity: 0; transform-box: fill-box; transform-origin: center;
             animation: pop .35s ease-out forwards; }
    .p1 { animation-delay: .95s; } .p2 { animation-delay: 1.03s; }
    .p3 { animation-delay: 1.11s; } .p4 { animation-delay: 1.19s; }

    .cal   { stroke: #5B7128; stroke-width: 2; stroke-linecap: round;
             stroke-dasharray: 96; stroke-dashoffset: 96;
             animation: draw .5s 1.25s ease-out forwards; }
    .cap   { stroke: #5B7128; stroke-width: 2; stroke-linecap: round; opacity: 0;
             animation: ink .25s 1.5s ease forwards; }
    .dim   { fill: #5B7128; opacity: 0; animation: ink .3s 1.6s ease forwards; }

    .title { opacity: 0; animation: rise .6s .35s ease-out forwards; }
    .sub   { opacity: 0; animation: rise .6s .55s ease-out forwards; }

    .rail  { stroke: #E2E6E3; stroke-width: 2; stroke-dasharray: 470; stroke-dashoffset: 470;
             animation: draw 1.4s 1.5s ease-out forwards; }
    .node  { opacity: 0; animation: pop .4s ease-out forwards; }
    .num   { fill: #6F7B76; opacity: 0; animation: ink .3s ease forwards; }
    .n1 { animation-delay: 1.65s; } .n2 { animation-delay: 1.80s; }
    .n3 { animation-delay: 1.95s; } .n4 { animation-delay: 2.10s; }
    .n5 { animation-delay: 2.25s; } .n6 { animation-delay: 2.40s; }
    .n7 { animation-delay: 2.55s; }

    /* one slow sweep along the rail, long after everything has settled */
    .sweep { fill: #5B7128; opacity: 0; animation: sweep 9s 3.4s ease-in-out infinite; }

    @keyframes draw  { to { stroke-dashoffset: 0; } }
    @keyframes ink   { to { fill-opacity: 1; opacity: 1; } }
    @keyframes pop   { from { opacity: 0; transform: scale(.3); }
                       to   { opacity: 1; transform: scale(1); } }
    @keyframes rise  { from { opacity: 0; transform: translateY(9px); }
                       to   { opacity: 1; transform: none; } }
    @keyframes sweep { 0% { opacity: 0; transform: translateX(0); }
                       6% { opacity: .9; } 40% { opacity: .9; }
                       46%, 100% { opacity: 0; transform: translateX(452px); } }

    @media (prefers-reduced-motion: reduce) {
      * { animation: none !important; }
      .coat { fill-opacity: 1; } .trace, .cal, .rail { stroke-dashoffset: 0; }
      .spot, .cap, .dim, .title, .sub, .node, .num { opacity: 1; }
    }
  </style>

  <rect class="paper" width="900" height="220"/>
  <rect class="edge" x="0.5" y="0.5" width="899" height="219"/>

  <!-- the mark -->
  <g transform="translate(56,44)">
    <ellipse class="coat"  cx="52" cy="44" rx="42" ry="33"/>
    <ellipse class="trace" cx="52" cy="44" rx="42" ry="33"/>
    <circle class="spot p1" cx="38" cy="34" r="4.6"/>
    <circle class="spot p2" cx="64" cy="38" r="3.6"/>
    <circle class="spot p3" cx="48" cy="54" r="3.1"/>
    <circle class="spot p4" cx="69" cy="55" r="2.6"/>
    <line class="cal" x1="10" y1="94" x2="94" y2="94"/>
    <line class="cap" x1="10" y1="87" x2="10" y2="101"/>
    <line class="cap" x1="94" y1="87" x2="94" y2="101"/>
    <text class="mono dim" x="52" y="115" text-anchor="middle">5.94 mm</text>
  </g>

  <!-- wordmark -->
  <g transform="translate(196,0)">
    <text class="word ink title" x="0" y="86">LentilSeedVision</text>
    <text class="tag muted sub" x="2" y="116">
      Image-based lentil seed phenotyping — tray photograph to phenotype data
    </text>

    <!-- the seven panels, lighting in order -->
    <g transform="translate(2,152)">
      <line class="rail" x1="0" y1="0" x2="470" y2="0"/>
      <g class="node n1"><circle cx="8"   cy="0" r="7" fill="#2E6FA8"/></g>
      <g class="node n2"><circle cx="82"  cy="0" r="7" fill="#3C8B57"/></g>
      <g class="node n3"><circle cx="156" cy="0" r="7" fill="#5B7128"/></g>
      <g class="node n4"><circle cx="230" cy="0" r="7" fill="#4E9A51"/></g>
      <g class="node n5"><circle cx="304" cy="0" r="7" fill="#7659A6"/></g>
      <g class="node n6"><circle cx="378" cy="0" r="7" fill="#B24C87"/></g>
      <g class="node n7"><circle cx="452" cy="0" r="7" fill="#2E86A0"/></g>
      <rect class="sweep" x="4" y="-11" width="9" height="22" rx="2"/>

      <text class="mono num n1" x="8"   y="26" text-anchor="middle">1</text>
      <text class="mono num n2" x="82"  y="26" text-anchor="middle">2</text>
      <text class="mono num n3" x="156" y="26" text-anchor="middle">3</text>
      <text class="mono num n4" x="230" y="26" text-anchor="middle">4</text>
      <text class="mono num n5" x="304" y="26" text-anchor="middle">5</text>
      <text class="mono num n6" x="378" y="26" text-anchor="middle">6</text>
      <text class="mono num n7" x="452" y="26" text-anchor="middle">7</text>
    </g>
  </g>
</svg>
